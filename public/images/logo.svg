<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- Left Icon: 5 and Star -->
  <g transform="translate(10, 15)">
    <!-- Drop Shadow Layers (Simulated without feGaussianBlur for perfect mobile sharpness) -->
    <text x="2" y="62" font-family="Times New Roman, serif" font-size="70" font-style="italic" font-weight="bold" fill="rgba(0,0,0,0.5)">5</text>
    <path d="M 47 17 L 52 32 L 67 32 L 54 42 L 59 57 L 47 47 L 35 57 L 40 42 L 27 32 L 42 32 Z" fill="rgba(0,0,0,0.5)"/>

    <!-- Main Gold Layers -->
    <text x="0" y="60" font-family="Times New Roman, serif" font-size="70" font-style="italic" font-weight="bold" fill="url(#goldGradient)">5</text>
    <!-- A Star overlapping the 5 -->
    <path d="M 45 15 L 50 30 L 65 30 L 52 40 L 57 55 L 45 45 L 33 55 L 38 40 L 25 30 L 40 30 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Text: STAR OXFORD -->
  <g transform="translate(85, 30)">
    <!-- Drop shadow -->
    <text x="2" y="22" font-family="'Outfit', sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="rgba(0,0,0,0.5)">STAR OXFORD</text>
    <text x="2" y="47" font-family="'Inter', sans-serif" font-size="14" font-weight="400" letter-spacing="8" fill="rgba(0,0,0,0.5)">CHAUFFEURS</text>
    
    <!-- Main Text -->
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#goldGradient)">STAR OXFORD</text>
    <!-- Subtitle -->
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="14" font-weight="400" letter-spacing="8" fill="#FFFFFF">CHAUFFEURS</text>
    <!-- Elegant Line -->
    <line x1="0" y1="58" x2="280" y2="58" stroke="url(#goldGradient)" stroke-width="1.5" />
    <line x1="2" y1="60" x2="282" y2="60" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" />
  </g>
</svg>
