<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon: 5 and Star -->
  <g transform="translate(10, 15)">
    <!-- A big elegant 5 -->
    <text x="0" y="60" font-family="Times New Roman, serif" font-size="70" font-style="italic" font-weight="bold" fill="url(#goldGradient)" filter="url(#glow)">5</text>
    <!-- A Star overlapping the 5 -->
    <path d="M 45 15 L 50 30 L 65 30 L 52 40 L 57 55 L 45 45 L 33 55 L 38 40 L 25 30 L 40 30 Z" fill="url(#goldGradient)" filter="url(#glow)"/>
  </g>

  <!-- Right Text -->
  <text x="95" y="45" font-family="sans-serif" font-size="34" font-weight="300" letter-spacing="3" fill="#FFFFFF">5 Star Oxford</text>
  <text x="98" y="75" font-family="sans-serif" font-size="14" font-weight="500" letter-spacing="10" fill="url(#goldGradient)">CHAUFFEURS</text>
</svg>
