<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F9F295" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Monogram Box -->
  <g transform="translate(20, 20)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="none" stroke="url(#goldGradient)" stroke-width="6"/>
    <!-- Inner border -->
    <rect x="10" y="10" width="140" height="140" rx="12" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- 5S Monogram -->
    <text x="80" y="115" font-family="'Playfair Display', 'Times New Roman', serif" font-size="90" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="-5">5S</text>
  </g>

  <!-- Divider Line -->
  <line x1="210" y1="40" x2="210" y2="160" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.5" />

  <!-- Text Section -->
  <g transform="translate(240, 110)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Playfair Display', 'Times New Roman', serif" font-size="70" font-weight="700" fill="url(#goldGradient)" letter-spacing="2" filter="url(#dropShadow)">5 STAR OXFORD</text>
    
    <!-- Subtitle -->
    <text x="5" y="35" font-family="'Inter', 'Arial', sans-serif" font-size="18" font-weight="300" fill="#E2E8F0" letter-spacing="8" text-transform="uppercase">Executive Chauffeurs</text>
  </g>
</svg>